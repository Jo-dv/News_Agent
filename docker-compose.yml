name: news_agent_v2

services:
  agent_app_v2:
    build: .
    image: news_agent_v2_image
    container_name: agent_app_v2
    networks:
      - v2_network
    volumes:
      - ./app:/app
      - ./chroma_data_v2:/app/chroma_data
      - ./logs:/app/logs
    env_file:
      - .env
    restart: unless-stopped
    command: tail -f /dev/null

networks:
  v2_network:
    driver: bridge